version: '3.8'

services:
  api:
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/data/etsy_monitor.db
    command: python -m api.monitoring_api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: ./app
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/data/etsy_monitor.db
    command: python worker.py --check-interval 300
    restart: unless-stopped
    depends_on:
      - api

volumes:
  data:
  logs: 