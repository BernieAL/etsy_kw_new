version: '3.8'

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
    command: python -m api.monitoring_api
    restart: unless-stopped

  worker:
    build: ./backend
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
    command: python worker.py --check-interval 300
    restart: unless-stopped
    depends_on:
      - api 