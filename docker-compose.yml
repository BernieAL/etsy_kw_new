version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    network_mode: host
    stdin_open: true
    tty: true
    command: tail -f /dev/null  # Keep container running indefinitely

