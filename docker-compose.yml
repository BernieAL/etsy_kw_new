version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: pass
    networks:
      - etsy_net
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - etsy_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./src
      dockerfile: api/Dockerfile.api
    volumes:
      - ./src/api:/app
      - ./src/common:/app/common
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://user:pass@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etsy_net

  scraper_worker:
    build:
      context: ./src
      dockerfile: workers/scraper_worker/Dockerfile.scraper_worker
    volumes:
      - ./src/workers:/app/workers
      - ./src/common:/app/common
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://user:pass@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etsy_net

  email_worker:
    build:
      context: ./src
      dockerfile: workers/email_worker/Dockerfile.email_worker
    volumes:
      - ./src/workers:/app/workers
      - ./src/common:/app/common
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://user:pass@rabbitmq:5672/
    command: ["python", "-m", "workers.email_worker.email_worker"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etsy_net

  client:
    build:
      context: ./client
      target: dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: ["npm", "run", "dev", "--", "--host"]
    networks:
      - etsy_net

networks:
  etsy_net:
    driver: bridge 